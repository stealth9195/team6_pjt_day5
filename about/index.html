<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회사소개 | 클래스로</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="page.css">
</head>
<body data-page="about">

  <!-- 머리글: layout.js가 채워요. 이 줄은 건드리지 않기 -->
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <!-- 여기부터 내 페이지 내용 -->
    <section class="page-header">
      <div class="container">
        <h1 class="page-header__title">회사소개</h1>
        <p class="page-header__lead">클래스로는 동네 공방·작업실의 원데이 클래스를 앱에서 찾고 바로 예약·결제하는 서비스예요.</p>
      </div>
    </section>

    <!-- 오시는 길 -->
    <section class="section" aria-labelledby="about-location-title">
      <div class="container">
        <h2 class="section__title" id="about-location-title">오시는 길</h2>
        <p class="about-note">주소와 찾아오는 방법은 아직 확인되지 않았어요. 확인되면 채울게요.</p>
        <dl class="about-info">
          <div class="about-info__row">
            <dt>주소</dt>
            <dd>[확인 필요]</dd>
          </div>
          <div class="about-info__row">
            <dt>지하철</dt>
            <dd>[확인 필요]</dd>
          </div>
          <div class="about-info__row">
            <dt>버스</dt>
            <dd>[확인 필요]</dd>
          </div>
          <div class="about-info__row">
            <dt>운영 시간</dt>
            <dd>[확인 필요]</dd>
          </div>
        </dl>
      </div>
    </section>

    <!-- 지도 -->
    <section class="section" aria-labelledby="about-map-title">
      <div class="container">
        <h2 class="section__title" id="about-map-title">지도</h2>
        <!-- 예시 지도: 실제 주소가 확인되면 iframe 의 q= 뒤 주소(주소를 URL 인코딩한 값)를 바꿔요 -->
        <p class="about-note">지도는 예시 위치예요. 실제 주소가 정해지면 바꿀게요.</p>
        <div class="about-map">
          <iframe
            title="클래스로 위치 지도 (예시)"
            src="https://maps.google.com/maps?q=%EC%84%9C%EC%9A%B8%20%EC%84%B1%EB%8F%99%EA%B5%AC%20%EC%84%B1%EC%88%98%EB%8F%99&output=embed&hl=ko"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen></iframe>
        </div>
      </div>
    </section>

    <!-- 기본 정보: 00_회사소개.md 에 있는 내용만 사용 -->
    <section class="section" aria-labelledby="about-basic-title">
      <div class="container">
        <h2 class="section__title" id="about-basic-title">기본 정보</h2>
        <dl class="about-info">
          <div class="about-info__row">
            <dt>설립</dt>
            <dd>2023년 3월</dd>
          </div>
          <div class="about-info__row">
            <dt>대표</dt>
            <dd>한서윤</dd>
          </div>
          <div class="about-info__row">
            <dt>직원</dt>
            <dd>30명</dd>
          </div>
          <div class="about-info__row">
            <dt>서비스</dt>
            <dd>iOS·Android 앱, 모바일 웹</dd>
          </div>
          <div class="about-info__row">
            <dt>제휴 공방</dt>
            <dd>약 420곳 (서울 280곳, 경기 110곳, 기타 30곳)</dd>
          </div>
          <div class="about-info__row">
            <dt>문의</dt>
            <dd>[확인 필요]</dd>
          </div>
        </dl>
      </div>
    </section>
    <!-- 여기까지 내 페이지 내용 -->
  </main>

  <!-- 바닥글: layout.js가 채워요. 이 줄은 건드리지 않기 -->
  <footer id="site-footer" class="site-footer"></footer>

  <script src="../layout.js"></script>
</body>
</html>
